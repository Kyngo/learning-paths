baseURL = "https://kyngo.github.io/learning-paths/"
defaultContentLanguage = "en"
title = "Software Engineering Learning Paths"

[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

[params]
  # Book theme settings
  BookTheme = "dark"           # light, dark, or auto
  BookToC = true               # Table of contents on pages
  BookSection = "paths"        # Root section for sidebar tree
  BookMenuBundle = "/menu"     # Menu bundle (optional)
  BookRepo = "https://github.com/arnaumartin/learning-paths"
  BookDateFormat = "January 2, 2006"
  BookSearch = true            # Enable search

  # Logo and branding
  BookLogo = "logo.png"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true            # Allow raw HTML in markdown (for Mermaid, etc.)
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
  [markup.highlight]
    style = "monokai"
    lineNos = false
    noClasses = false
